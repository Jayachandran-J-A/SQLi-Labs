resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_forwarded_for $xff {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $xff;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;

    location = / { try_files /index.html =404; }

    location = /notes   { return 301 /notes/; }
    location = /shop    { return 301 /shop/; }
    location = /people  { return 301 /people/; }
    location = /blog    { return 301 /blog/; }
    location = /support { return 301 /support/; }

    location /notes/ {
        set $up http://notes:5000;
        rewrite ^/notes/(.*)$ /$1 break;
        proxy_pass $up;
    }
    location /shop/ {
        set $up http://shop:80;
        rewrite ^/shop/(.*)$ /$1 break;
        proxy_pass $up;
    }
    location /people/ {
        set $up http://people:3000;
        rewrite ^/people/(.*)$ /$1 break;
        proxy_pass $up;
    }
    location /blog/ {
        set $up http://blog:5000;
        rewrite ^/blog/(.*)$ /$1 break;
        proxy_pass $up;
    }
    location /support/ {
        set $up http://support:5000;
        rewrite ^/support/(.*)$ /$1 break;
        proxy_pass $up;
    }
}
