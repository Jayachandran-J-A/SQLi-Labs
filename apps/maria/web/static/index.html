<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inkwell</title>
<style>
:root{--bg:#fffdf9;--ink:#222;--mut:#8a8478;--acc:#c0392b;--card:#fff;--line:#eee7da}
*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;background:var(--bg);color:var(--ink)}
header{border-bottom:2px solid var(--ink);padding:18px 24px;display:flex;align-items:baseline;gap:24px;flex-wrap:wrap}
header h1{margin:0;font-size:34px;letter-spacing:-1px}#tag{color:var(--mut);font-style:italic}
nav a{font-family:system-ui;font-size:14px;margin-right:16px;color:var(--ink);text-decoration:none;cursor:pointer}nav a:hover{color:var(--acc)}
.sp{flex:1}#who{font-family:system-ui;font-size:13px;color:var(--mut)}
main{max-width:1050px;margin:24px auto;padding:0 20px;display:grid;grid-template-columns:1fr 250px;gap:28px}
@media(max-width:800px){main{grid-template-columns:1fr}}
article.p{border-bottom:1px solid var(--line);padding:14px 0}article.p h2{margin:0 0 4px;font-size:24px}article.p h2 a{color:inherit;text-decoration:none;cursor:pointer}
article.p small{font-family:system-ui;color:var(--mut)}
input,textarea,button,select{font-size:14px;font-family:system-ui}input,textarea{padding:8px;border:1px solid var(--line);border-radius:4px;background:#fff;width:100%;margin-bottom:8px}
button{background:var(--acc);color:#fff;border:0;border-radius:4px;padding:8px 14px;cursor:pointer}
.box{background:var(--card);border:1px solid var(--line);padding:14px;margin-bottom:16px}
aside h4{font-family:system-ui;font-size:12px;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
.chip{display:inline-block;border:1px solid var(--line);padding:3px 10px;margin:2px;font-family:system-ui;font-size:12px;cursor:pointer;border-radius:12px}
.cm{border-top:1px dashed var(--line);padding:8px 0;font-size:14px}
.hide{display:none}#toast{position:fixed;bottom:16px;right:16px;background:#7a1f1f;color:#fff;padding:10px 14px;border-radius:6px;max-width:460px;font-family:monospace;font-size:12px;display:none;word-break:break-all}
</style></head><body>
<header><h1>Inkwell</h1><span id="tag">...</span>
<nav><a onclick="view('home')">Home</a><a onclick="view('acct')">Account</a>
<a>EN</a></nav><span class="sp"></span><span id="who"></span></header>
<main><section>
 <div id="v-home">
  <div class="box"><input id="q" placeholder="Search articles by title" onkeydown="if(event.key==='Enter')search()"><button onclick="search()">Search</button></div>
  <div id="list"></div>
 </div>
 <div id="v-post" class="hide"><button onclick="view('home')">&larr; Back</button><article class="p" id="post"></article>
  <div class="box"><h3>Comments</h3><div id="cms"></div><br><input id="ca" placeholder="Name"><textarea id="cb" rows="2" placeholder="Your comment"></textarea><button onclick="addComment()">Post comment</button></div></div>
 <div id="v-acct" class="hide">
  <div class="box"><h3>Sign in</h3><input id="lu" placeholder="Username"><input id="lp" type="password" placeholder="Password"><button onclick="login()">Sign in</button></div>
  <div class="box"><h3>Join Inkwell</h3><input id="ru" placeholder="Username"><input id="rp" type="password" placeholder="Password"><button onclick="reg()">Register</button></div>
  <div id="me" class="hide"><div class="box"><h3>Your profile</h3><input id="dn" placeholder="Display name"><button onclick="saveName()">Save</button></div>
   <div class="box"><h3>Your comments</h3><div id="mc"></div></div></div>
 </div>
</section>
<aside>
 <div class="box"><h4>Topics</h4><span class="chip" onclick="byTag('')">all</span><span class="chip" onclick="byTag('engineering')">engineering</span><span class="chip" onclick="byTag('culture')">culture</span><span class="chip" onclick="byTag('lifestyle')">lifestyle</span></div>
 <div class="box"><h4>Most read</h4><div id="pop"></div></div>
 <div class="box"><h4 id="subl">Subscribe</h4><input placeholder="you@example.com"><button onclick="toast('Thanks for subscribing!')">Go</button></div>
</aside></main>
<div id="toast"></div><script src="static/app.js"></script></body></html>
