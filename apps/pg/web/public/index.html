<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PeopleHub</title>
<style>
:root{--bg:#f4f6fb;--ink:#1c2340;--mut:#6a7390;--acc:#4f46e5;--card:#fff;--line:#e2e6f3}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--acc);color:#fff;padding:14px 24px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
header h1{margin:0;font-size:21px}header a{color:#e0e0ff;text-decoration:none;font-size:14px;cursor:pointer}.sp{flex:1}
main{max-width:1100px;margin:20px auto;padding:0 20px;display:grid;grid-template-columns:1fr 270px;gap:20px}
@media(max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:16px}.card small{color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
select,input,textarea,button{font:inherit;font-size:14px}select,input,textarea{padding:8px;border:1px solid var(--line);border-radius:6px;background:#fff}
button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
.chip{background:#fff;border:1px solid var(--line);border-radius:18px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
aside h4{margin:0 0 8px;font-size:12px;color:var(--mut);text-transform:uppercase}
.mini{font-size:12px;color:var(--mut);border-bottom:1px dashed var(--line);padding:5px 0;word-break:break-all}
.hide{display:none}#toast{position:fixed;bottom:16px;right:16px;background:#7a1f1f;color:#fff;padding:10px 14px;border-radius:6px;max-width:460px;font-family:monospace;font-size:12px;display:none;word-break:break-all}
</style></head><body>
<header><h1>PeopleHub</h1><a onclick="view('dir')">Directory</a><a onclick="view('leave')">Leave</a><a onclick="view('acct')">Account</a><span class="sp"></span><span id="who"></span></header>
<main><section>
  <div id="v-dir">
    <div class="row" id="depts"></div>
    <div class="row"><input id="q" placeholder="Search name or title" onkeydown="if(event.key==='Enter')search()"><button onclick="search()">Search</button>
      <span class="sp"></span><label>Sort&nbsp;<select id="sort" onchange="load()"><option value="name">Name</option><option value="title">Title</option><option value="department">Department</option><option value="id">Newest hire</option></select></label></div>
    <div id="list"></div>
  </div>
  <div id="v-emp" class="hide"><button onclick="view('dir')">&larr; Back</button><div class="card" id="emp" style="margin-top:12px"></div></div>
  <div id="v-leave" class="hide">
    <div class="card"><h3>Request leave</h3><div class="row"><input id="lby" placeholder="Your username"><input id="ldays" type="number" min="1" value="1" style="width:80px"></div>
      <textarea id="lreason" rows="2" style="width:100%" placeholder="Reason"></textarea><br><br><button onclick="sendLeave()">Submit request</button></div>
    <div class="card"><h3>Recent requests (team)</h3><div id="board"></div></div>
    <div class="card"><h3>My requests</h3><div id="mine"><small>Create an account to track your own requests.</small></div></div>
  </div>
  <div id="v-acct" class="hide">
    <div class="card"><h3>Sign in</h3><div class="row"><input id="lu" placeholder="Username"><input id="lp" type="password" placeholder="Password"><button onclick="login()">Sign in</button></div><div id="msg"></div></div>
    <div class="card"><h3>New to PeopleHub?</h3><div class="row"><input id="ru" placeholder="Username"><input id="rp" type="password" placeholder="Password"><button onclick="signup()">Create account</button></div></div>
  </div>
</section>
<aside><div class="card"><h4>Sign-in activity</h4><div id="audit"></div></div></aside></main>
<div id="toast"></div><script src="app.js"></script></body></html>
